<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Campus Bazaar</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; gap: 30px; }
        .image-section { flex: 1; }
        .image-section img { width: 100%; border-radius: 8px; object-fit: cover; border: 1px solid #ddd; }
        .details-section { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        h1 { margin: 0; font-size: 24px; color: #333; }
        .price { font-size: 28px; font-weight: bold; color: #0066cc; }
        .badge { display: inline-block; padding: 4px 8px; background: #eee; border-radius: 4px; font-size: 12px; font-weight: bold; color: #555; }
        .btn { padding: 12px; background: #28a745; color: white; text-align: center; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: auto; }
        .btn:hover { background: #218838; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #0066cc; font-weight: bold; }
    </style>
</head>
<body>

    <div style="max-width: 800px; margin: 0 auto;">
        <a href="/dashboard" class="back-link">← Back to Dashboard</a>
    </div>

    <div class="container" id="product-container">
        <!-- Content will load here -->
        <p>Loading product details...</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/';
                return;
            }

            // Get product ID from URL (e.g., /product?id=5)
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                document.getElementById('product-container').innerHTML = "<p>Product not found.</p>";
                return;
            }

            try {
                const response = await fetch(`/api/products/${productId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Failed to fetch product");
                const product = await response.json();

                const imageUrl = product.images.length > 0 ? product.images[0] : '';
                
                document.getElementById('product-container').innerHTML = `
                    <div class="image-section">
                        ${imageUrl ? `<img src="${imageUrl}" alt="${product.ProductName}">` : `<div style="height:300px; background:#eee; display:flex; align-items:center; justify-content:center; border-radius:8px;">No Image</div>`}
                    </div>
                    <div class="details-section">
                        <div>
                            <span class="badge">${product.CategoryName}</span>
                            <span class="badge" style="margin-left: 5px;">Condition: ${product.ConditionStatus}</span>
                        </div>
                        <h1>${product.ProductName}</h1>
                        <div class="price">₹ ${product.SellingPrice}</div>
                        
                        <p style="color: #666; margin: 0;"><strong>Listed by:</strong> ${product.SellerName}</p>
                        
                        <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #eee;">
                            <h3 style="margin-top:0; font-size: 16px;">Details</h3>
                            <p style="margin: 5px 0; font-size: 14px;"><strong>Used for:</strong> ${product.UsageDuration || 'N/A'}</p>
                            <p style="margin: 5px 0; font-size: 14px;"><strong>Purchased:</strong> ${product.PurchaseDateApprox || 'N/A'}</p>
                            <p style="margin: 15px 0 5px 0; font-size: 14px;"><strong>Description:</strong><br> ${product.Description}</p>
                            ${product.DefectDetails ? `<p style="margin: 10px 0 0 0; font-size: 14px; color: #d9534f;"><strong>Defects:</strong> ${product.DefectDetails}</p>` : ''}
                        </div>

                        <button class="btn" onclick="requestItem(${product.ProductID})">Express Interest to Buy</button>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                document.getElementById('product-container').innerHTML = "<p>Error loading product.</p>";
            }
        });

        function requestItem(id) {
            alert("This will insert a row into the InterestRequests table!");
        }
    </script>
</body>
</html>

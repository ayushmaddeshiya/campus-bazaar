<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Purchases - Campus Bazaar</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; }
        .dashboard-container { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: white; border-right: 1px solid #ddd; padding: 20px; box-sizing: border-box; }
        .sidebar-logo { font-size: 20px; font-weight: bold; margin-bottom: 30px; }
        .nav-item { display: block; padding: 10px 15px; color: #333; text-decoration: none; border-radius: 5px; margin-bottom: 5px; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: #e6f0fa; color: #0066cc; }
        .main-content { flex: 1; padding: 30px; box-sizing: border-box; }
        .request-card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-accepted { background: #d4edda; color: #155724; }
        .status-declined { background: #f8d7da; color: #721c24; }
        .btn-chat { background: #0066cc; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        @media(max-width: 768px) { .dashboard-container { flex-direction: column; } .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #ddd; } }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-logo">Campus <span style="color: #0066cc;">Bazaar</span></div>
            <a href="/dashboard" class="nav-item">🏠 Home / Browse</a>
            <a href="/sell" class="nav-item">➕ Sell an Item</a>
            <a href="/my-listings" class="nav-item">🏷️ My Listings</a>
            <a href="/purchases" class="nav-item active">❤️ My Purchases</a>
            <a href="/profile" class="nav-item">👤 Profile</a>
            <a href="#" onclick="logout()" class="nav-item" style="margin-top: 30px; color: #dc3545;">🚪 Logout</a>
        </div>
        <div class="main-content">
            <h2>Items I Want to Buy</h2>
            <div id="purchases-list">Loading...</div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '/'; return; }

            try {
                const res = await fetch('/api/purchases', { headers: { 'Authorization': `Bearer ${token}` }});
                const purchases = await res.json();
                const container = document.getElementById('purchases-list');
                
                if (purchases.length === 0) {
                    container.innerHTML = "<p>You haven't sent any interest requests yet.</p>";
                    return;
                }

                container.innerHTML = '';
                purchases.forEach(p => {
                    let badgeClass = p.RequestStatus === 'Accepted' ? 'status-accepted' : (p.RequestStatus === 'Declined' ? 'status-declined' : 'status-pending');
                    let chatButton = p.RequestStatus === 'Accepted' 
                        ? `<button class="btn-chat" onclick="openChat(${p.ProductID}, ${p.SellerID})">💬 Chat with Seller</button>` 
                        : '';

                    container.innerHTML += `
                        <div class="request-card">
                            <div>
                                <h3 style="margin: 0 0 5px 0;">${p.ProductName}</h3>
                                <p style="margin: 0; color: #666;">Seller: ${p.SellerName} • Price: ₹${p.SellingPrice}</p>
                            </div>
                            <div style="text-align: right;">
                                <div class="status-badge ${badgeClass}" style="margin-bottom: 10px; display: inline-block;">${p.RequestStatus}</div>
                                <br>${chatButton}
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                document.getElementById('purchases-list').innerHTML = "<p>Error loading purchases.</p>";
            }
        });

        async function openChat(productId, sellerId) {
            const token = localStorage.getItem('token');
            const res = await fetch('/api/conversations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ productId, sellerId })
            });
            const data = await res.json();
            window.location.href = `/chat?conversationId=${data.conversationId}`;
        }
        function logout() { localStorage.removeItem('token'); window.location.href = '/'; }
    </script>
</body>
</html>
